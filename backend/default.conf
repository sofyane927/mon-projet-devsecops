# Configuration des serveurs BACKEND (web1, web2).
# Ils servent la page statique et s'identifient via l'en-tête X-Backend
# (pour prouver que le load balancing fonctionne).
# Pas d'en-têtes de sécurité ici : c'est le reverse proxy en frontal qui les pose.

server {
    listen 80;
    server_name localhost;

    sendfile off;

    # $hostname = nom du conteneur (web1 / web2), défini via "hostname:" dans compose.
    # Permet de voir quel backend a répondu.
    add_header X-Backend $hostname always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}
