# Masque la version de Nginx dans l'en-tête "Server" (anti fuite d'info)
server_tokens off;

server {
    listen 80;
    server_name localhost;

    # sendfile off : corrige le bug de fichiers servis "vides" (octets nuls)
    # sur certains systèmes de fichiers virtuels (Docker Desktop / WSL2).
    sendfile off;

    # --- En-têtes de sécurité (recommandations OWASP Secure Headers) ---
    # "always" force l'envoi de l'en-tête même sur les réponses d'erreur (4xx/5xx).
    add_header X-Frame-Options "SAMEORIGIN" always;                    # anti-clickjacking
    add_header X-Content-Type-Options "nosniff" always;                # anti MIME-sniffing
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    # HSTS : effectif en HTTPS, force le navigateur à n'utiliser que TLS pendant 1 an.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}
