# ============================================================================
#  REVERSE PROXY + LOAD BALANCER (point d'entrée public)
# ============================================================================

# Groupe d'upstream : nginx répartit les requêtes entre les 2 backends.
# Algorithme par défaut = round-robin (à tour de rôle).
upstream backend_servers {
    server web1:80;
    server web2:80;
}

# --- Étape 3 : zone de rate limiting (contexte http) ---
# Clé = IP du client ; 10 Mo de mémoire ; 10 requêtes par minute.
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/m;

server {
    listen 80;
    server_name localhost;

    server_tokens off;  # masque la version de Nginx (anti fuite d'info)

    # --- En-têtes de sécurité (relocalisés ici depuis le Challenge 3) ---
    # Posés sur le proxy : ils s'appliquent à TOUTES les réponses vues par le
    # client, y compris les blocages (403/429) générés par le proxy lui-même.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Étape 2 : n'autoriser que GET et POST, sinon 403 ---
    # $request_method = verbe HTTP. !~ = "ne correspond pas" (regex).
    if ($request_method !~ ^(GET|POST)$) {
        return 403;
    }

    # --- Étape 4 : mini-WAF, blocage des patterns suspects dans l'URL ---
    # Couvre XSS, injection SQL, path traversal, exécution de commandes.
    if ($request_uri ~* "(\.\./|/etc/passwd|<script|%3cscript|union.*select|select.*from|insert.*into|drop.*table|base64_decode|/bin/sh)") {
        return 403;
    }

    location / {
        # --- Étape 3 : application du rate limiting (10/min/IP) ---
        limit_req zone=perip burst=10 nodelay;
        limit_req_status 429;   # code renvoyé quand la limite est dépassée

        proxy_pass http://backend_servers;

        # Transmission des infos client réelles aux backends
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
