name: CI/CD DevSecOps

# Déclenchement sur push et pull request sur la branche principale
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-scan:
    name: Build & Scan de sécurité
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # 2. Construction de l'image Docker
      - name: Build de l'image Docker
        run: docker build -t mon-projet-web:${{ github.sha }} .

      # 3a. Scan Trivy — inventaire complet (non bloquant, pour visibilité)
      - name: Scan de sécurité Trivy (rapport)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mon-projet-web:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM

      # 3b. Scan Trivy — BLOQUANT : échoue le pipeline si une CRITICAL est trouvée
      - name: Blocage si vulnérabilité CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mon-projet-web:${{ github.sha }}
          format: table
          exit-code: 1            # 1 = fait échouer le job
          severity: CRITICAL       # on ne bloque que sur les CRITICAL
          ignore-unfixed: false

      # 4. Test rapide : le conteneur démarre et répond
      - name: Test de démarrage du conteneur
        run: |
          docker run -d --name test-web -p 8080:80 mon-projet-web:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8080/ || (docker logs test-web && exit 1)
          docker rm -f test-web

  performance-test:
    name: Tests de performance (k6 + hey)
    needs: build-and-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Build de l'image Docker
        run: docker build -t mon-projet-web:${{ github.sha }} .

      - name: Démarrage du conteneur
        run: |
          docker run -d --name perf-web -p 8080:80 mon-projet-web:${{ github.sha }}
          # Attente que le serveur réponde (jusqu'à ~20s)
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/ > /dev/null; then echo "Conteneur prêt"; break; fi
            echo "En attente du conteneur..."; sleep 2
          done

      - name: Installation de k6
        uses: grafana/setup-k6-action@v1

      - name: Lancement du test de performance k6
        run: k6 run -e BASE_URL=http://localhost:8080 tests/performance/load-test.js

      # --- hey : test de charge brut (haut débit) ---
      - name: Installation de hey
        run: |
          # Go est préinstallé sur les runners ubuntu-latest
          go install github.com/rakyll/hey@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Test de charge hey
        run: |
          # 50 workers pendant 20s, test de débit brut + latences (rapport seulement).
          # NB : le garde-fou qui bloque le pipeline reste le job k6 (seuils p95 / taux d'erreurs).
          hey -z 20s -c 50 http://localhost:8080

      - name: Arrêt du conteneur
        if: always()
        run: docker rm -f perf-web

  gatling-test:
    name: Test de performance (Gatling)
    needs: build-and-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Build de l'image Docker
        run: docker build -t mon-projet-web:${{ github.sha }} .

      - name: Démarrage du conteneur
        run: |
          docker run -d --name gatling-web -p 8080:80 mon-projet-web:${{ github.sha }}
          # Attente que le serveur réponde (jusqu'à ~20s)
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/ > /dev/null; then echo "Conteneur prêt"; break; fi
            echo "En attente du conteneur..."; sleep 2
          done

      - name: Installation de Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Lancement du test de performance Gatling
        working-directory: tests/gatling
        run: mvn -B gatling:test "-DbaseUrl=http://localhost:8080" "-Dgatling.simulationClass=BasicSimulation"

      - name: Publication du rapport Gatling
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-gatling
          path: tests/gatling/target/gatling/**
          if-no-files-found: ignore

      - name: Arrêt du conteneur
        if: always()
        run: docker rm -f gatling-web

  security-headers:
    name: Test de sécurité des en-têtes HTTP
    needs: build-and-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Build de l'image Docker
        run: docker build -t mon-projet-web:${{ github.sha }} .

      - name: Démarrage du conteneur
        run: |
          docker run -d --name headers-web -p 8080:80 mon-projet-web:${{ github.sha }}
          # Attente que le serveur réponde (jusqu'à ~20s)
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/ > /dev/null; then echo "Conteneur prêt"; break; fi
            echo "En attente du conteneur..."; sleep 2
          done

      - name: Vérification des en-têtes de sécurité (OWASP)
        run: |
          chmod +x tests/security/check-headers.sh
          ./tests/security/check-headers.sh http://localhost:8080

      - name: Arrêt du conteneur
        if: always()
        run: docker rm -f headers-web

  deploy:
    name: Déploiement
    needs: [ build-and-scan, performance-test, gatling-test, security-headers ]
    runs-on: ubuntu-latest
    # Déploiement uniquement sur la branche main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Étape de déploiement (exemple)
        run: |
          echo "🚀 Déploiement de l'application..."
          echo "Ici, ajoute tes commandes de déploiement réelles"
          echo "(ex: push vers un registre, déploiement sur un serveur, etc.)"
