name: CI/CD DevSecOps

# Déclenchement sur push et pull request sur la branche principale
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-scan:
    name: Build & Scan de sécurité
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # 2. Construction de l'image Docker
      - name: Build de l'image Docker
        run: docker build -t mon-projet-web:${{ github.sha }} .

      # 3. Scan de vulnérabilités de l'image avec Trivy (sécurité)
      - name: Scan de sécurité avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mon-projet-web:${{ github.sha }}
          format: table
          exit-code: 0          # mettre 1 pour bloquer en cas de vulnérabilité critique
          severity: CRITICAL,HIGH

      # 4. Test rapide : le conteneur démarre et répond
      - name: Test de démarrage du conteneur
        run: |
          docker run -d --name test-web -p 8080:80 mon-projet-web:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8080/ || (docker logs test-web && exit 1)
          docker rm -f test-web

  performance-test:
    name: Test de performance (k6)
    needs: build-and-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Build de l'image Docker
        run: docker build -t mon-projet-web:${{ github.sha }} .

      - name: Démarrage du conteneur
        run: |
          docker run -d --name perf-web -p 8080:80 mon-projet-web:${{ github.sha }}
          # Attente que le serveur réponde (jusqu'à ~20s)
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/ > /dev/null; then echo "Conteneur prêt"; break; fi
            echo "En attente du conteneur..."; sleep 2
          done

      - name: Installation de k6
        uses: grafana/setup-k6-action@v1

      - name: Lancement du test de performance k6
        run: k6 run -e BASE_URL=http://localhost:8080 tests/performance/load-test.js

      - name: Arrêt du conteneur
        if: always()
        run: docker rm -f perf-web

  deploy:
    name: Déploiement
    needs: [ build-and-scan, performance-test ]
    runs-on: ubuntu-latest
    # Déploiement uniquement sur la branche main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Étape de déploiement (exemple)
        run: |
          echo "🚀 Déploiement de l'application..."
          echo "Ici, ajoute tes commandes de déploiement réelles"
          echo "(ex: push vers un registre, déploiement sur un serveur, etc.)"
