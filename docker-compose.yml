# Architecture Challenge 5 : reverse proxy + load balancer vers 2 backends
#
#                    ┌──────────────┐
#   client :8080 ──> │    proxy     │ ──┬──> web1:80
#                    │ (LB + règles)│   └──> web2:80
#                    └──────────────┘
#
# Lancer : docker compose up --build -d

services:
  # --- Backend n°1 (construit notre image applicative, déjà scannée Trivy) ---
  web1:
    build: .
    image: mon-projet-web:latest
    container_name: mon-projet-web1
    hostname: web1                       # => en-tête X-Backend: web1
    volumes:
      - ./backend/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  # --- Backend n°2 (réutilise l'image construite par web1) ---
  web2:
    image: mon-projet-web:latest
    container_name: mon-projet-web2
    hostname: web2                       # => en-tête X-Backend: web2
    depends_on:
      - web1
    volumes:
      - ./backend/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  # --- Reverse proxy / load balancer (point d'entrée public) ---
  proxy:
    image: nginx:1.29-alpine
    container_name: mon-projet-proxy
    ports:
      - "8080:80"
    depends_on:
      - web1
      - web2
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
